# Copy to .github/workflows/codeturtle.yml in any repo that has the Mac runners (macci add owner/repo).
# codeturtle-protocol: 2
name: codeturtle
# Dispatched runs carry the caller's request id in their title so a caller can find the run it started.
run-name: ${{ github.event_name == 'workflow_dispatch' && format('codeturtle PR {0} {1}', inputs.pr, inputs.request_id) || 'codeturtle' }}

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number
        required: true
      tier:
        description: fast, normal or full (empty = choose automatically)
        required: false
      min_tier:
        description: lowest tier allowed (raises the automatic choice, never lowers it)
        required: false
      request_id:
        description: caller's correlation id, echoed in the result artifact
        required: false
      fresh:
        description: review the whole PR instead of following up on the last review (true/false)
        required: false

permissions:
  contents: read
  pull-requests: write
  issues: write # 👀 reaction on /review comments and failure notices

jobs:
  review:
    # Never start on a fork PR, and only start on a /review comment from someone with write access,
    # so an outside comment can't occupy the runner or cancel a running review via `concurrency`.
    if: >-
      (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/review') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macOS, ARM64, mac-ci]
    timeout-minutes: 120
    concurrency:
      group: codeturtle-${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr }}
      cancel-in-progress: true
    steps:
      - uses: LiquidatorCoder/codeturtle@v1
